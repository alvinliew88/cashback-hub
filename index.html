<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Finory</title>
<style>
  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --border: #1a1a1a;
    --text: #ffffff;
    --text-secondary: #a0a0a0;
    --text-muted: #555555;
    --accent: #3b82f6;
    --btn-bg: #141414;
    --btn-active: #222222;
    --input-bg: #7dd3fc;
    --input-border: #38bdf8;
    --input-shadow: rgba(56, 189, 248, 0.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    overscroll-behavior-y: auto;
    padding: 10px 10px 60px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  .card-bar { height: 4px; width: 100%; }
  .bar-rhb { background: linear-gradient(90deg, #f97316, #ef4444); }
  .bar-affin { background: linear-gradient(90deg, #3b82f6, #2563eb); }
  .bar-ikhwan { background: linear-gradient(90deg, #9ca3af, #4b5563); }
  .bar-maybank { background: linear-gradient(90deg, #fbbf24, #d97706); }

  .card-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 14px;
    position: relative;
    cursor: pointer;
    user-select: none;
  }
  .card-summary-left { flex: 1; min-width: 0; padding-right: 8px; }
  .card-summary-right { text-align: right; margin-right: 18px; }
  .card-arrow {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: var(--text-muted);
    transition: transform 0.2s;
  }
  .card-arrow.open { transform: translateY(-50%) rotate(180deg); }

  .card-name { font-weight: 800; font-size: 15px; letter-spacing: -0.3px; color: #fff; line-height: 1.2; }
  .cycle-info {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 4px;
    font-weight: 600;
  }
  .cb-amount {
    font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Monaco, 'Cascadia Mono', monospace;
    font-size: 22px;
    font-weight: 900;
    line-height: 1;
    color: #fff;
  }
  .spend-amount {
    font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Monaco, monospace;
    font-size: 11px;
    color: #7dd3fc;
    margin-top: 3px;
    font-weight: 700;
  }

  .card-detail {
    display: none;
    padding: 0 14px 14px;
    border-top: 1px solid var(--border);
  }
  .card-detail.open { display: block; }

  .cat-progress-list { margin-top: 12px; margin-bottom: 0; }
  .cat-progress { margin-bottom: 10px; }
  .cat-progress:last-child { margin-bottom: 0; }
  .cat-label-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 5px;
  }
  .cat-label-name { font-size: 14px; font-weight: 700; color: #e5e5e5; }
  .cat-label-value {
    font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Monaco, monospace;
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 600;
  }
  .cat-track {
    width: 100%;
    height: 8px;
    background: #111111;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid #222;
  }
  .cat-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.3s ease;
    min-width: 2px;
  }
  .fill-cyan   { background: linear-gradient(90deg, #22d3ee, #06b6d4); box-shadow: 0 0 6px rgba(34,211,238,0.25); }
  .fill-lime   { background: linear-gradient(90deg, #a3e635, #65a30d); box-shadow: 0 0 6px rgba(163,230,53,0.25); }
  .fill-violet { background: linear-gradient(90deg, #c084fc, #7c3aed); box-shadow: 0 0 6px rgba(192,132,252,0.25); }
  .fill-coral  { background: linear-gradient(90deg, #fb7185, #e11d48); box-shadow: 0 0 6px rgba(251,113,133,0.25); }
  .fill-amber  { background: linear-gradient(90deg, #fbbf24, #d97706); box-shadow: 0 0 6px rgba(251,191,36,0.25); }

  .amt-input {
    width: 100%;
    background: var(--input-bg);
    border: 2px solid var(--input-border);
    color: #000;
    border-radius: 12px;
    padding: 14px;
    font-size: 20px;
    outline: none;
    font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Monaco, monospace;
    font-weight: 900;
    height: 52px;
    margin-top: 12px;
    margin-bottom: 8px;
    box-shadow: 0 0 12px var(--input-shadow);
  }
  .amt-input::placeholder { color: #0369a1; font-weight: 700; }
  .amt-input:focus {
    border-color: #fff;
    box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.5), 0 0 20px rgba(56, 189, 248, 0.6);
  }

  .btn-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cat-btn {
    width: 100%;
    background: var(--btn-bg);
    border: 1px solid var(--border);
    color: #fff;
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.02em;
  }
  .cat-btn:active { background: var(--btn-active); transform: scale(0.98); }
  /* 已满返现的按钮：红色背景，但不阻止点击 */
  .cat-btn.maxed {
    background: #7f1d1d;
    border-color: #dc2626;
    color: #ffffff;
    /* 保留 pointer-events: auto，可以点击 */
  }
  .cat-btn.maxed:active {
    background: #991b1b;
  }

  .card-tx-section {
    margin-top: 12px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .card-tx-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .card-tx-empty {
    text-align: center;
    color: #333;
    font-size: 13px;
    padding: 8px 0;
    font-weight: 600;
  }
  .card-detail .tx-row { padding: 8px 0; }
  .card-detail .tx-del { padding: 2px 8px; font-size: 10px; }

  .stmt-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .stmt-total-label {
    font-size: 13px;
    font-weight: 700;
    color: #7dd3fc;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .stmt-total-value {
    font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Monaco, monospace;
    font-size: 16px;
    font-weight: 900;
    color: #7dd3fc;
  }

  .prev-stmt-total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0 6px 0;
    margin-top: 10px;
    border-top: 1px solid #2a2a2a;
  }
  .prev-stmt-total-label {
    font-size: 13px;
    font-weight: 700;
    color: #facc15;
    letter-spacing: 0.04em;
  }
  .prev-stmt-total-value {
    font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Monaco, monospace;
    font-size: 16px;
    font-weight: 900;
    color: #facc15;
  }
  .prev-stmt-cycle {
    font-size: 10px;
    color: #777;
    font-weight: 600;
    margin-left: 6px;
  }

  .history-section { margin-top: 28px; }
  .history-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 12px;
    color: #fff;
  }
  .cycle-box {
    background: var(--surface);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
    border-left: 4px solid;
  }
  .cycle-box.rhb-border { border-left-color: #f97316; }
  .cycle-box.affin-border { border-left-color: #3b82f6; }
  .cycle-box.ikhwan-border { border-left-color: #9ca3af; }
  .cycle-box.maybank-border { border-left-color: #fbbf24; }

  .cycle-header {
    padding: 14px;
    background: #0f0f0f;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
  }
  .cycle-header.active { border-bottom-color: var(--border); }
  .cycle-name { font-weight: 800; font-size: 14px; color: #fff; }
  .cycle-range {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    margin-top: 2px;
  }
  .cycle-count {
    font-size: 11px;
    color: var(--text-muted);
    background: #1a1a1a;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: 700;
  }
  .cycle-arrow {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: 6px;
    transition: transform 0.2s;
    display: inline-block;
  }
  .cycle-arrow.open { transform: rotate(180deg); }
  .cycle-body { display: none; padding: 12px 14px; }
  .cycle-body.open { display: block; }

  .tx-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid #1a1a1a;
    gap: 10px;
  }
  .tx-row:last-child { border-bottom: none; }
  .tx-left { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .tx-date {
    font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Monaco, monospace;
    font-size: 11px;
    color: var(--text-muted);
  }
  .tx-cat { font-size: 13px; color: var(--text-secondary); font-weight: 700; }
  .tx-note {
    font-size: 11px;
    color: #444;
    font-style: italic;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tx-right {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    white-space: nowrap;
  }
  .tx-amt {
    font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Monaco, monospace;
    font-size: 13px;
    font-weight: 800;
    color: #fff;
  }
  .tx-del {
    font-size: 11px;
    color: #666;
    background: #1a1a1a;
    border: 1px solid #222;
    border-radius: 6px;
    padding: 3px 10px;
    cursor: pointer;
    font-weight: 700;
  }
  .tx-del:active { background: #222; }
  .history-meta {
    text-align: center;
    color: #333;
    font-size: 11px;
    margin-top: 16px;
    font-weight: 600;
  }
  .empty-state {
    text-align: center;
    color: #333;
    font-size: 14px;
    padding: 24px;
    font-weight: 600;
  }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>

<div id="card-container"></div>

<div class="history-section">
  <div class="history-title">📋 History (90 Days)</div>
  <div id="history-container"></div>
  <div class="history-meta" id="history-meta"></div>
</div>

<script>
(function() {
  'use strict';

  const CARDS_DEF = [
    {
      name: "RHB Shell 2498",
      barClass: "bar-rhb",
      borderClass: "rhb-border",
      resetDay: 13,
      cats: ["Petrol", "Utilities", "E-Wallet"],
      caps: { Petrol: 30, Utilities: 10, "E-Wallet": 10 },
      minSpend: { Petrol: 0, Utilities: 250, "E-Wallet": 500 },
      rates: {
        Petrol:    [0.01, 0.03, 0.05, 0.12],
        Utilities: [0.002, 0.01, 0.02, 0.05],
        "E-Wallet": [0.002, 0.01, 0.02, 0.05]
      },
      progressTargets: {
        Petrol: 250,
        Utilities: 250,
        "E-Wallet": 3000
      }
    },
    {
      name: "RHB Shell 8652",
      barClass: "bar-rhb",
      borderClass: "rhb-border",
      resetDay: 23,
      cats: ["Petrol", "Utilities", "E-Wallet"],
      caps: { Petrol: 30, Utilities: 10, "E-Wallet": 10 },
      minSpend: { Petrol: 0, Utilities: 250, "E-Wallet": 500 },
      rates: {
        Petrol:    [0.01, 0.03, 0.05, 0.12],
        Utilities: [0.002, 0.01, 0.02, 0.05],
        "E-Wallet": [0.002, 0.01, 0.02, 0.05]
      },
      progressTargets: {
        Petrol: 250,
        Utilities: 250,
        "E-Wallet": 3000
      }
    },
    {
      name: "Affin Duo Visa 3322",
      barClass: "bar-affin",
      borderClass: "affin-border",
      resetDay: 23,
      cap: 30,
      cats: ["Auto-Billing", "E-Commerce", "E-Wallet"],
      rates: { "Auto-Billing": 0.03, "E-Commerce": 0.03, "E-Wallet": 0.03 },
      autoDebit: { amount: 700, category: "Auto-Billing", note: "Insurance Auto-Debit" }
    },
    {
      name: "Ikhwan Platinum 6157",
      barClass: "bar-ikhwan",
      borderClass: "ikhwan-border",
      resetDay: 1,
      cap: 50,
      fixedCategory: "Online (8%)",
      cats: ["Online (8%)"],
      rates: { "Online (8%)": 0.08 }
    },
    {
      name: "Maybank 2 Gold 8943",
      barClass: "bar-maybank",
      borderClass: "maybank-border",
      resetDay: 1,
      cap: 50,
      fixedCategory: "Weekend (5%)",
      cats: ["Weekend (5%)"],
      rates: { "Weekend (5%)": 0.05 }
    }
  ];

  const MAX_CYCLES = 3;
  const FILL_COLORS = ['fill-cyan', 'fill-lime', 'fill-violet', 'fill-coral', 'fill-amber'];

  function formatDateDMY(d) {
    const date = new Date(d + 'T00:00:00');
    return `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`;
  }

  function getTodayStr() {
    const n = new Date();
    return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
  }

  function getCycleStart(day) {
    const now = new Date();
    let start = new Date(now.getFullYear(), now.getMonth(), day);
    if (now.getDate() < day) start.setMonth(start.getMonth() - 1);
    return `${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(start.getDate()).padStart(2,'0')}`;
  }

  function getCycleEnd(startStr) {
    const [y, m, d] = startStr.split('-').map(Number);
    const end = new Date(y, m - 1, d);
    end.setMonth(end.getMonth() + 1);
    end.setDate(end.getDate() - 1);
    return `${end.getFullYear()}-${String(end.getMonth()+1).padStart(2,'0')}-${String(end.getDate()).padStart(2,'0')}`;
  }

  function getRateTier(totalSpend) {
    if (totalSpend >= 3000) return 3;
    if (totalSpend >= 2000) return 2;
    if (totalSpend >= 1000) return 1;
    return 0;
  }

  function loadState() {
    const raw = localStorage.getItem('finoryData');
    let state;
    if (raw) {
      try { state = JSON.parse(raw); } catch(e) { state = null; }
    }

    if (!state || !state.cards || state.version !== 7) {
      const cards = CARDS_DEF.map(c => ({
        ...c,
        totalSpend: 0,
        cashback: 0,
        categoryCashback: {},
        categorySpend: {},
        lastCycleStart: getCycleStart(c.resetDay),
        autoDebitCycle: null
      }));
      state = { version: 7, cards, transactions: [] };

      if (raw) {
        try {
          const old = JSON.parse(raw);
          if (old.cards && Array.isArray(old.cards)) {
            old.cards.forEach((oc, i) => {
              if (state.cards[i]) {
                state.cards[i].totalSpend = typeof oc.totalSpend === 'number' ? oc.totalSpend : 0;
                state.cards[i].cashback = typeof oc.cashback === 'number' ? oc.cashback : 0;
                state.cards[i].categoryCashback = oc.categoryCashback || {};
                state.cards[i].categorySpend = oc.categorySpend || {};
                if (oc.lastCycleStart) state.cards[i].lastCycleStart = oc.lastCycleStart;
                if (oc.autoDebitCycle) state.cards[i].autoDebitCycle = oc.autoDebitCycle;
              }
            });
          }
          if (old.transactions && Array.isArray(old.transactions)) {
            state.transactions = old.transactions;
          }
        } catch(e) {}
      }
      saveState(state);
    }
    return state;
  }

  function saveState(state) {
    localStorage.setItem('finoryData', JSON.stringify(state));
  }

  function checkAndReset(state) {
    state.cards.forEach(c => {
      const currentStart = getCycleStart(c.resetDay);
      if (c.lastCycleStart !== currentStart) {
        c.totalSpend = 0;
        c.cashback = 0;
        c.categoryCashback = {};
        c.categorySpend = {};
        c.lastCycleStart = currentStart;
      }
    });
  }

  function applyAutoDebits(state) {
    let changed = false;
    state.cards.forEach((c, i) => {
      const def = CARDS_DEF[i];
      if (def.autoDebit) {
        if (c.lastCycleStart !== c.autoDebitCycle) {
          const rate = def.rates[def.autoDebit.category];
          const rawEarned = def.autoDebit.amount * rate;
          const cap = def.cap || 999;
          const remaining = cap - c.cashback;
          const earned = Math.max(0, Math.min(rawEarned, remaining));

          c.totalSpend += def.autoDebit.amount;
          c.cashback += earned;
          c.categorySpend[def.autoDebit.category] = (c.categorySpend[def.autoDebit.category] || 0) + def.autoDebit.amount;
          c.autoDebitCycle = c.lastCycleStart;

          state.transactions.push({
            id: Date.now() + '-auto-' + i,
            cardIndex: i,
            cardName: def.name,
            amount: def.autoDebit.amount,
            category: def.autoDebit.category,
            note: def.autoDebit.note,
            date: getTodayStr(),
            timestamp: Date.now(),
            cycleStart: c.lastCycleStart
          });
          changed = true;
        }
      }
    });
    if (changed) saveState(state);
  }

  function getRate(cardDef, cardState, cat, amount) {
    if (cardDef.name.includes("RHB")) {
      const min = cardDef.minSpend?.[cat] || 0;
      if (amount < min) return 0;
      const tier = getRateTier(cardState.totalSpend + amount);
      const rates = cardDef.rates[cat];
      return rates ? rates[tier] : 0;
    }
    if (cardDef.rates && cardDef.rates[cat] !== undefined) {
      return cardDef.rates[cat];
    }
    return 0;
  }

  function recalcCard(state, cardIndex) {
    const def = CARDS_DEF[cardIndex];
    const cardState = state.cards[cardIndex];
    cardState.totalSpend = 0;
    cardState.cashback = 0;
    cardState.categoryCashback = {};
    cardState.categorySpend = {};

    const txs = state.transactions
      .filter(t => t.cardIndex === cardIndex && t.cycleStart === cardState.lastCycleStart)
      .sort((a, b) => a.timestamp - b.timestamp);

    txs.forEach(tx => {
      const rate = getRate(def, cardState, tx.category, tx.amount);
      let earned = 0;
      if (def.name.includes("RHB")) {
        const cap = def.caps[tx.category] || 999;
        const currentCatCb = cardState.categoryCashback?.[tx.category] || 0;
        const remaining = cap - currentCatCb;
        earned = tx.amount * rate;
        if (earned > remaining) earned = remaining;
        if (earned < 0) earned = 0;
        cardState.cashback += earned;
        cardState.categoryCashback[tx.category] = currentCatCb + earned;
        cardState.categorySpend[tx.category] = (cardState.categorySpend[tx.category] || 0) + tx.amount;
      } else {
        earned = tx.amount * rate;
        const cap = def.cap || 999;
        const remaining = cap - cardState.cashback;
        if (earned > remaining) earned = remaining;
        if (earned < 0) earned = 0;
        cardState.cashback += earned;
        cardState.categorySpend[tx.category] = (cardState.categorySpend[tx.category] || 0) + tx.amount;
      }
      cardState.totalSpend += tx.amount;
    });
  }

  function addTransaction(cardIndex, amount, cat, note) {
    const state = loadState();
    checkAndReset(state);
    const cardState = state.cards[cardIndex];
    const cardDef = CARDS_DEF[cardIndex];

    const rate = getRate(cardDef, cardState, cat, amount);
    let earned = 0;

    if (cardDef.name.includes("RHB")) {
      const cap = cardDef.caps[cat] || 999;
      const currentCatCb = cardState.categoryCashback?.[cat] || 0;
      const remaining = cap - currentCatCb;
      earned = amount * rate;
      if (earned > remaining) earned = remaining;
      if (earned < 0) earned = 0;
      cardState.cashback += earned;
      cardState.categoryCashback[cat] = currentCatCb + earned;
      cardState.categorySpend[cat] = (cardState.categorySpend[cat] || 0) + amount;
    } else {
      earned = amount * rate;
      const cap = cardDef.cap || 999;
      const remaining = cap - cardState.cashback;
      if (earned > remaining) earned = remaining;
      if (earned < 0) earned = 0;
      cardState.cashback += earned;
      cardState.categorySpend[cat] = (cardState.categorySpend[cat] || 0) + amount;
    }

    cardState.totalSpend += amount;

    const now = new Date();
    const tx = {
      id: now.getTime() + '-' + Math.random().toString(36).slice(2, 7),
      cardIndex,
      cardName: cardDef.name,
      amount,
      category: cat,
      note: note || '',
      date: getTodayStr(),
      timestamp: now.getTime(),
      cycleStart: cardState.lastCycleStart
    };
    state.transactions.push(tx);

    cleanupOldCycles(state);
    saveState(state);
    render();
  }

  function deleteTransaction(txId) {
    if (!confirm('Delete this transaction?')) return;
    const state = loadState();
    const tx = state.transactions.find(t => t.id === txId);
    if (!tx) return;

    state.transactions = state.transactions.filter(t => t.id !== txId);
    recalcCard(state, tx.cardIndex);
    cleanupOldCycles(state);
    saveState(state);
    render();
  }

  function cleanupOldCycles(state) {
    state.cards.forEach((c, i) => {
      const cycles = [];
      state.transactions.forEach(tx => {
        if (tx.cardIndex === i && !cycles.includes(tx.cycleStart)) cycles.push(tx.cycleStart);
      });
      cycles.sort((a, b) => b.localeCompare(a));
      if (cycles.length > MAX_CYCLES) {
        const toDelete = cycles.slice(MAX_CYCLES);
        state.transactions = state.transactions.filter(tx => {
          if (tx.cardIndex !== i) return true;
          return !toDelete.includes(tx.cycleStart);
        });
      }
    });
  }

  function getProgressPct(used, target) {
    if (target <= 0) return 0;
    return Math.min(100, Math.max(0, (used / target) * 100));
  }

  function buildProgressHtml(cardState, cardDef) {
    if (cardDef.name.includes("RHB")) {
      return cardDef.cats.map((cat, idx) => {
        const target = cardDef.progressTargets?.[cat] || 100;
        const spent = cardState.categorySpend?.[cat] || 0;
        const pct = getProgressPct(spent, target);
        const colorClass = FILL_COLORS[idx % FILL_COLORS.length];
        const remaining = Math.max(0, target - spent);
        return `
          <div class="cat-progress">
            <div class="cat-label-row">
              <span class="cat-label-name">${cat}</span>
              <span class="cat-label-value">RM ${spent.toFixed(2)} / ${target} · ${remaining.toFixed(2)} left</span>
            </div>
            <div class="cat-track">
              <div class="cat-fill ${colorClass}" style="width:${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    const cap = cardDef.cap || 999;
    const used = cardState.cashback;
    const pct = getProgressPct(used, cap);
    const colorClass = FILL_COLORS[0];
    const remaining = Math.max(0, cap - used);
    const catName = cardDef.fixedCategory || 'Cashback';
    return `
      <div class="cat-progress">
        <div class="cat-label-row">
          <span class="cat-label-name">${catName}</span>
          <span class="cat-label-value">RM ${used.toFixed(2)} / ${cap} · ${remaining.toFixed(2)} left</span>
        </div>
        <div class="cat-track">
          <div class="cat-fill ${colorClass}" style="width:${pct}%"></div>
        </div>
      </div>
    `;
  }

  // 判断某个类别是否已满返现（用于按钮红色提醒）
  function isCatMaxed(cardState, cardDef, cat) {
    if (cardDef.name.includes("RHB")) {
      const cap = cardDef.caps[cat] || 999;
      const used = cardState.categoryCashback?.[cat] || 0;
      return used >= cap;
    }
    // 非RHB卡，单卡总返现上限
    return cardState.cashback >= (cardDef.cap || 999);
  }

  function saveTx(i, cat) {
    const amtIn = document.getElementById('amt-' + i);
    const amt = parseFloat(amtIn.value);
    if (!amt || amt <= 0) return;
    addTransaction(i, amt, cat, '');
    amtIn.value = '';
  }

  function toggleCard(i) {
    const detail = document.getElementById('card-detail-' + i);
    const arrow = document.getElementById('card-arrow-' + i);
    const isOpen = detail.classList.contains('open');
    if (isOpen) {
      detail.classList.remove('open');
      if (arrow) arrow.classList.remove('open');
    } else {
      detail.classList.add('open');
      if (arrow) arrow.classList.add('open');
    }
  }

  function renderCards() {
    const state = loadState();
    checkAndReset(state);
    applyAutoDebits(state);
    saveState(state);

    const container = document.getElementById('card-container');
    container.innerHTML = state.cards.map((c, i) => {
      const def = CARDS_DEF[i];
      const start = c.lastCycleStart;
      const end = getCycleEnd(start);
      const progressHtml = buildProgressHtml(c, def);

      const allPrevTxs = state.transactions
        .filter(t => t.cardIndex === i && t.cycleStart !== c.lastCycleStart)
        .sort((a, b) => b.cycleStart.localeCompare(a.cycleStart));

      let prevTotal = 0;
      let prevCycleLabel = '';
      if (allPrevTxs.length > 0) {
        const latestPrevCycle = allPrevTxs[0].cycleStart;
        const filteredPrev = allPrevTxs.filter(t => t.cycleStart === latestPrevCycle);
        prevTotal = filteredPrev.reduce((sum, t) => sum + t.amount, 0);
        const prevEnd = getCycleEnd(latestPrevCycle);
        prevCycleLabel = `(${formatDateDMY(latestPrevCycle)} - ${formatDateDMY(prevEnd)})`;
      }

      const currentTxs = state.transactions
        .filter(t => t.cardIndex === i && t.cycleStart === c.lastCycleStart)
        .sort((a, b) => b.timestamp - a.timestamp);

      const txRows = currentTxs.map(tx => `
        <div class="tx-row">
          <div class="tx-left">
            <div>
              <span class="tx-date">${tx.date.slice(8,10)}/${tx.date.slice(5,7)}</span>
              <span class="tx-cat">${tx.category}</span>
            </div>
            ${tx.note ? `<div class="tx-note">${tx.note}</div>` : ''}
          </div>
          <div class="tx-right">
            <div class="tx-amt">RM ${tx.amount.toFixed(2)}</div>
            <button class="tx-del" onclick="window._app.deleteTransaction('${tx.id}')">Delete</button>
          </div>
        </div>
      `).join('');

      const txSection = currentTxs.length
        ? `<div class="card-tx-section"><div class="card-tx-title">This Cycle (${currentTxs.length})</div>${txRows}</div>`
        : '<div class="card-tx-section card-tx-empty">No transactions this cycle</div>';

      let btnHtml;
      if (def.fixedCategory) {
        const maxed = isCatMaxed(c, def, def.fixedCategory) ? 'maxed' : '';
        btnHtml = `<div class="btn-row"><button class="cat-btn ${maxed}" onclick="window._app.saveTx(${i}, '${def.fixedCategory}')">Add ${def.fixedCategory}</button></div>`;
      } else {
        btnHtml = `<div class="btn-row">${def.cats.map(cat => {
          const maxed = isCatMaxed(c, def, cat) ? 'maxed' : '';
          return `<button class="cat-btn ${maxed}" onclick="window._app.saveTx(${i}, '${cat}')">${cat}</button>`;
        }).join('')}</div>`;
      }

      const prevRowHtml = prevTotal > 0 ? `
        <div class="prev-stmt-total-row">
          <span class="prev-stmt-total-label">📄 上期账单总额 (已结算) <span class="prev-stmt-cycle">${prevCycleLabel}</span></span>
          <span class="prev-stmt-total-value">RM ${prevTotal.toFixed(2)}</span>
        </div>
      ` : '';

      return `
        <div class="card">
          <div class="card-bar ${def.barClass}"></div>
          <div class="card-summary" onclick="window._app.toggleCard(${i})">
            <div class="card-summary-left">
              <div class="card-name">${def.name}</div>
              <div class="cycle-info">${formatDateDMY(start)} — ${formatDateDMY(end)}</div>
            </div>
            <div class="card-summary-right">
              <div class="cb-amount">RM ${c.cashback.toFixed(2)}</div>
              <div class="spend-amount">Spend RM ${c.totalSpend.toFixed(2)}</div>
            </div>
            <div class="card-arrow" id="card-arrow-${i}">▼</div>
          </div>
          <div class="card-detail" id="card-detail-${i}">
            <div class="stmt-total-row">
              <span class="stmt-total-label">本周期消费总额 (当前)</span>
              <span class="stmt-total-value">RM ${c.totalSpend.toFixed(2)}</span>
            </div>

            <div class="cat-progress-list">${progressHtml}</div>

            <input type="number" id="amt-${i}" class="amt-input" placeholder="0.00" step="0.01">
            ${btnHtml}
            
            ${prevRowHtml}
            
            ${txSection}
          </div>
        </div>
      `;
    }).join('');
  }

  function renderHistory() {
    const state = loadState();
    const container = document.getElementById('history-container');
    const meta = document.getElementById('history-meta');

    const currentCycleStarts = state.cards.map(c => c.lastCycleStart);
    const pastTransactions = state.transactions.filter(tx => tx.cycleStart !== currentCycleStarts[tx.cardIndex]);

    if (!pastTransactions.length) {
      container.innerHTML = '<div class="empty-state">No past transactions.</div>';
      meta.textContent = '';
      return;
    }

    const groups = {};
    pastTransactions.forEach(tx => {
      const key = tx.cardIndex + '|' + tx.cycleStart;
      if (!groups[key]) groups[key] = [];
      groups[key].push(tx);
    });

    const sortedKeys = Object.keys(groups).sort((a, b) => {
      const [ca, sa] = a.split('|');
      const [cb, sb] = b.split('|');
      if (sa !== sb) return sb.localeCompare(sa);
      return parseInt(ca) - parseInt(cb);
    });

    container.innerHTML = sortedKeys.map(key => {
      const [cardIdx, cycleStart] = key.split('|');
      const cidx = parseInt(cardIdx);
      const def = CARDS_DEF[cidx];
      const txs = groups[key].sort((a, b) => b.timestamp - a.timestamp);
      const cycleEnd = getCycleEnd(cycleStart);
      const total = txs.reduce((s, t) => s + t.amount, 0);

      const rows = txs.map(tx => `
        <div class="tx-row">
          <div class="tx-left">
            <div>
              <span class="tx-date">${tx.date.slice(8,10)}/${tx.date.slice(5,7)}</span>
              <span class="tx-cat">${tx.category}</span>
            </div>
            ${tx.note ? `<div class="tx-note">${tx.note}</div>` : ''}
          </div>
          <div class="tx-right">
            <div class="tx-amt">RM ${tx.amount.toFixed(2)}</div>
            <button class="tx-del" onclick="window._app.deleteTransaction('${tx.id}')">Delete</button>
          </div>
        </div>
      `).join('');

      return `
        <div class="cycle-box ${def.borderClass}">
          <div class="cycle-header" onclick="window._app.toggleCycle(this)">
            <div>
              <div class="cycle-name">${def.name}</div>
              <div class="cycle-range">${formatDateDMY(cycleStart)} — ${formatDateDMY(cycleEnd)}</div>
            </div>
            <div style="display:flex;align-items:center;">
              <span class="cycle-count">${txs.length} tx · RM ${total.toFixed(2)}</span>
              <span class="cycle-arrow">▼</span>
            </div>
          </div>
          <div class="cycle-body">
            ${rows}
          </div>
        </div>
      `;
    }).join('');

    let cycleCounts = [];
    state.cards.forEach((c, i) => {
      const cycles = [];
      state.transactions.forEach(tx => {
        if (tx.cardIndex === i && tx.cycleStart !== c.lastCycleStart && !cycles.includes(tx.cycleStart)) cycles.push(tx.cycleStart);
      });
      cycleCounts.push(`${CARDS_DEF[i].name.split(' ').pop()}: ${cycles.length}/${MAX_CYCLES}`);
    });
    meta.textContent = `Past cycles kept for 90 days • ${cycleCounts.join(' · ')}`;
  }

  function toggleCycle(header) {
    const body = header.nextElementSibling;
    const arrow = header.querySelector('.cycle-arrow');
    const isOpen = body.classList.contains('open');
    if (isOpen) {
      body.classList.remove('open');
      arrow.classList.remove('open');
      header.classList.remove('active');
    } else {
      body.classList.add('open');
      arrow.classList.add('open');
      header.classList.add('active');
    }
  }

  function render() {
    renderCards();
    renderHistory();
  }

  window._app = {
    saveTx,
    toggleCard,
    toggleCycle,
    deleteTransaction
  };

  render();
})();
</script>
</body>
</html>
