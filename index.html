<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finory v4.0 - S25 Edition</title>
<style>
  :root {
    --bg: #000000;
    --surface: #121826;
    --surface-card: #1e293b;
    --border: #334155;
    --text-main: #ffffff;
    --text-muted: #94a3b8;
    --accent-blue: #3b82f6;
    --accent-green: #22c55e;
    --accent-red: #ef4444;
    --accent-amber: #f59e0b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    padding: 12px 12px 60px;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部快捷记账区 */
  .quick-panel {
    background: var(--surface-card);
    border: 2px solid var(--accent-blue);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25);
  }
  .panel-title {
    font-size: 18px;
    font-weight: 800;
    color: #60a5fa;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .quick-input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .quick-amt-input {
    flex: 1;
    background: #0f172a;
    border: 2px solid #38bdf8;
    color: #38bdf8;
    border-radius: 12px;
    padding: 12px;
    font-size: 28px;
    font-family: monospace;
    font-weight: 900;
    outline: none;
    text-align: right;
  }
  .quick-amt-input::placeholder { color: #1e3a8a; }
  .quick-btn-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .quick-cat-btn {
    background: #1e293b;
    border: 2px solid var(--border);
    color: #fff;
    border-radius: 12px;
    padding: 14px 8px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .quick-cat-btn:active { background: #334155; transform: scale(0.97); }
  .quick-cat-btn span.sub { font-size: 12px; color: var(--text-muted); font-weight: 600; }

  /* 卡片列表 */
  .section-header {
    font-size: 20px;
    font-weight: 900;
    margin: 20px 0 12px 4px;
    color: #f3f4f6;
  }
  .card {
    background: var(--surface-card);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .card-bar { height: 6px; width: 100%; }
  .bar-rhb { background: linear-gradient(90deg, #f97316, #ef4444); }
  .bar-affin { background: linear-gradient(90deg, #3b82f6, #1d4ed8); }
  .bar-maybank { background: linear-gradient(90deg, #fbbf24, #d97706); }

  .card-summary {
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .card-name { font-size: 18px; font-weight: 900; color: #fff; }
  .cycle-info { font-size: 13px; color: var(--text-muted); font-weight: 700; margin-top: 2px; }
  .cb-amount { font-size: 26px; font-weight: 900; color: var(--accent-green); text-align: right; font-family: monospace; }
  .spend-amount { font-size: 13px; color: #7dd3fc; text-align: right; font-weight: 700; margin-top: 2px; }

  /* 卡片展开区域 */
  .card-detail { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
  .card-detail.open { display: block; }
  
  .cat-progress { margin-top: 12px; }
  .cat-label-row { display: flex; justify-content: space-between; font-size: 15px; font-weight: 800; margin-bottom: 4px; }
  .cat-track { height: 12px; background: #0f172a; border-radius: 6px; overflow: hidden; border: 1px solid #334155; }
  .cat-fill { height: 100%; border-radius: 6px; }
  .fill-green { background: var(--accent-green); }
  .fill-amber { background: var(--accent-amber); }
  .fill-red { background: var(--accent-red); }

  /* 交易记录 */
  .tx-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .tx-date { font-size: 13px; color: var(--text-muted); font-family: monospace; }
  .tx-cat { font-size: 15px; font-weight: 800; color: #e2e8f0; }
  .tx-amt { font-size: 16px; font-weight: 900; font-family: monospace; color: #fff; }
  .tx-del { background: #7f1d1d; border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 800; }

  /* Toast 消息提示 */
  #toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #15803d; color: #fff; padding: 12px 24px; border-radius: 30px;
    font-size: 16px; font-weight: 800; display: none; z-index: 999;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 360px;
  }
  #toast.error { background: #b91c1c; }
</style>
</head>
<body>

<div id="toast"></div>

<!-- 顶部一键快捷记账 -->
<div class="quick-panel">
  <div class="panel-title">
    <span>⚡ 极速记账</span>
    <span style="font-size: 13px; color: var(--text-muted);">S25 优化版</span>
  </div>
  <div class="quick-input-group">
    <input type="number" id="quick-amt" class="quick-amt-input" placeholder="0.00" step="0.01">
  </div>
  <div class="quick-btn-grid">
    <button class="quick-cat-btn" onclick="quickAdd('Petrol')">
      ⛽ 汽油 (Petrol)
      <span class="sub">优先 RHB 卡</span>
    </button>
    <button class="quick-cat-btn" onclick="quickAdd('Utilities')">
      💡 水电 (Utilities)
      <span class="sub">优先 RHB 卡</span>
    </button>
    <button class="quick-cat-btn" onclick="quickAdd('Online')">
      🛒 网购 (Online)
      <span class="sub">RHB / MBB Ikhwan</span>
    </button>
    <button class="quick-cat-btn" onclick="quickAdd('E-Wallet')">
      💳 电子钱包 / Weekend
      <span class="sub">Affin / MBB Gold</span>
    </button>
  </div>
</div>

<!-- 卡片进度 -->
<div class="section-header">💳 信用卡返现进度</div>
<div id="card-container"></div>

<script>
// 四舍五入保留两位小数
function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }

// 卡片定义（修复 RHB 5000 门槛）
const CARDS_DEF = [
  {
    name: "RHB Shell 2498",
    barClass: "bar-rhb",
    resetDay: 13,
    cats: ["Petrol", "Utilities", "Online"],
    caps: { Petrol: 30, Utilities: 10, Online: 10 },
    rates: {
      Petrol:    [0.01, 0.03, 0.05, 0.12], // Tier 0, 1, 2, 3
      Utilities: [0.002, 0.01, 0.02, 0.05],
      Online:    [0.002, 0.01, 0.02, 0.05]
    }
  },
  {
    name: "RHB Shell 8652",
    barClass: "bar-rhb",
    resetDay: 23,
    cats: ["Petrol", "Utilities", "Online"],
    caps: { Petrol: 30, Utilities: 10, Online: 10 },
    rates: {
      Petrol:    [0.01, 0.03, 0.05, 0.12],
      Utilities: [0.002, 0.01, 0.02, 0.05],
      Online:    [0.002, 0.01, 0.02, 0.05]
    }
  },
  {
    name: "Affin Duo Visa 3322",
    barClass: "bar-affin",
    resetDay: 23,
    cap: 30,
    cats: ["Auto-Billing", "E-Commerce", "E-Wallet"],
    rates: { "Auto-Billing": 0.03, "E-Commerce": 0.03, "E-Wallet": 0.03 },
    autoDebit: { amount: 700, category: "Auto-Billing", note: "Insurance Auto-Debit" }
  },
  {
    name: "Maybank Ikhwan 6157",
    barClass: "bar-maybank",
    resetDay: 1,
    cap: 50,
    cats: ["Online (8%)"],
    rates: { "Online (8%)": 0.08 },
    targetSpend: 625
  },
  {
    name: "Maybank 2 Gold 8943",
    barClass: "bar-maybank",
    resetDay: 1,
    cap: 50,
    cats: ["Weekend (5%)"],
    rates: { "Weekend (5%)": 0.05 },
    targetSpend: 1000
  }
];

// 正确计算 RHB 真实 Tier (基于 RM 5000 / 2500 / 1000)
function getRHBTier(totalSpend) {
  if (totalSpend >= 5000) return 3;
  if (totalSpend >= 2500) return 2;
  if (totalSpend >= 1000) return 1;
  return 0;
}

// 修复跨月/2月截账日计算 Bug
function getCycleStart(day) {
  const now = new Date();
  let y = now.getFullYear();
  let m = now.getMonth();
  if (now.getDate() < day) {
    m -= 1;
    if (m < 0) { m = 11; y -= 1; }
  }
  const maxDaysInMonth = new Date(y, m + 1, 0).getDate();
  const actualDay = Math.min(day, maxDaysInMonth);
  const start = new Date(y, m, actualDay);
  return `${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(start.getDate()).padStart(2,'0')}`;
}

function getCycleEnd(startStr) {
  const [y, m, d] = startStr.split('-').map(Number);
  const end = new Date(y, m - 1, d);
  end.setMonth(end.getMonth() + 1);
  end.setDate(end.getDate() - 1);
  return `${end.getFullYear()}-${String(end.getMonth()+1).padStart(2,'0')}-${String(end.getDate()).padStart(2,'0')}`;
}

// 提示弹窗
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isError ? 'error' : '';
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2500);
}

// 本地存储管理
function loadState() {
  let raw = localStorage.getItem('finoryData_v4');
  let state = raw ? JSON.parse(raw) : null;
  if (!state) {
    state = {
      cards: CARDS_DEF.map(c => ({
        totalSpend: 0,
        cashback: 0,
        categorySpend: {},
        categoryCashback: {},
        lastCycleStart: getCycleStart(c.resetDay)
      })),
      transactions: []
    };
    saveState(state);
  }
  return state;
}

function saveState(state) {
  localStorage.setItem('finoryData_v4', JSON.stringify(state));
}

// 重算单张卡片的返现
function recalcCard(state, cardIndex) {
  const def = CARDS_DEF[cardIndex];
  const cardState = state.cards[cardIndex];
  cardState.totalSpend = 0;
  cardState.cashback = 0;
  cardState.categorySpend = {};
  cardState.categoryCashback = {};

  const txs = state.transactions.filter(t => t.cardIndex === cardIndex && t.cycleStart === cardState.lastCycleStart);
  txs.sort((a, b) => a.timestamp - b.timestamp);

  // 计算卡片总消费
  txs.forEach(t => cardState.totalSpend += t.amount);
  cardState.totalSpend = round2(cardState.totalSpend);

  // 计算返现
  txs.forEach(tx => {
    let rate = 0;
    if (def.name.includes("RHB")) {
      const tier = getRHBTier(cardState.totalSpend);
      rate = def.rates[tx.category][tier];
      const cap = def.caps[tx.category];
      const currentCb = cardState.categoryCashback[tx.category] || 0;
      let earned = round2(tx.amount * rate);
      if (currentCb + earned > cap) earned = round2(cap - currentCb);
      if (earned < 0) earned = 0;

      cardState.cashback = round2(cardState.cashback + earned);
      cardState.categoryCashback[tx.category] = round2(currentCb + earned);
    } else {
      rate = def.rates[tx.category] || 0;
      const cap = def.cap;
      let earned = round2(tx.amount * rate);
      if (cardState.cashback + earned > cap) earned = round2(cap - cardState.cashback);
      if (earned < 0) earned = 0;

      cardState.cashback = round2(cardState.cashback + earned);
    }
    cardState.categorySpend[tx.category] = round2((cardState.categorySpend[tx.category] || 0) + tx.amount);
  });
}

// 快速智能添加交易
function quickAdd(cat) {
  const amtIn = document.getElementById('quick-amt');
  const amt = parseFloat(amtIn.value);
  if (!amt || amt <= 0) {
    showToast("⚠️ 请先输入有效金额", true);
    return;
  }

  const state = loadState();
  let targetCardIndex = 0;

  // 根据类别自动推荐最合适的卡片
  if (cat === 'Petrol') {
    // 优先选未满上限的 RHB 卡
    targetCardIndex = (state.cards[0].categoryCashback['Petrol'] || 0) < 30 ? 0 : 1;
  } else if (cat === 'Utilities') {
    targetCardIndex = (state.cards[0].categoryCashback['Utilities'] || 0) < 10 ? 0 : 1;
  } else if (cat === 'Online') {
    targetCardIndex = 3; // Maybank Ikhwan
  } else {
    targetCardIndex = 2; // Affin
    cat = 'E-Wallet';
  }

  const cardState = state.cards[targetCardIndex];
  const tx = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2, 5),
    cardIndex: targetCardIndex,
    amount: round2(amt),
    category: cat,
    timestamp: Date.now(),
    cycleStart: cardState.lastCycleStart
  };

  state.transactions.push(tx);
  recalcCard(state, targetCardIndex);
  saveState(state);
  amtIn.value = '';
  renderAll();
  showToast(`✅ 已记 RM ${amt.toFixed(2)} 到 ${CARDS_DEF[targetCardIndex].name}`);
}

function deleteTx(id) {
  const state = loadState();
  const tx = state.transactions.find(t => t.id === id);
  if (!tx) return;
  state.transactions = state.transactions.filter(t => t.id !== id);
  recalcCard(state, tx.cardIndex);
  saveState(state);
  renderAll();
  showToast("🗑️ 已删除交易");
}

function toggleDetail(i) {
  const el = document.getElementById(`detail-${i}`);
  if (el) el.classList.toggle('open');
}

// 渲染界面
function renderAll() {
  const state = loadState();
  const container = document.getElementById('card-container');

  container.innerHTML = state.cards.map((c, i) => {
    const def = CARDS_DEF[i];
    const start = c.lastCycleStart;
    const end = getCycleEnd(start);

    // 计算进度条
    let progressHtml = '';
    if (def.name.includes("RHB")) {
      const tier = getRHBTier(c.totalSpend);
      progressHtml = def.cats.map(cat => {
        const cbUsed = c.categoryCashback[cat] || 0;
        const cap = def.caps[cat];
        const pct = Math.min(100, (cbUsed / cap) * 100);
        const colorClass = pct >= 100 ? 'fill-red' : (pct > 50 ? 'fill-amber' : 'fill-green');
        return `
          <div class="cat-progress">
            <div class="cat-label-row">
              <span>${cat} (Tier ${tier} 返现)</span>
              <span>RM ${cbUsed.toFixed(2)} / RM ${cap}</span>
            </div>
            <div class="cat-track"><div class="cat-fill ${colorClass}" style="width:${pct}%"></div></div>
          </div>
        `;
      }).join('');
    } else {
      const cap = def.cap;
      const pct = Math.min(100, (c.cashback / cap) * 100);
      const colorClass = pct >= 100 ? 'fill-red' : 'fill-green';
      progressHtml = `
        <div class="cat-progress">
          <div class="cat-label-row">
            <span>总返现进度</span>
            <span>RM ${c.cashback.toFixed(2)} / RM ${cap}</span>
          </div>
          <div class="cat-track"><div class="cat-fill ${colorClass}" style="width:${pct}%"></div></div>
        </div>
      `;
    }

    // 本期交易记录
    const currentTxs = state.transactions.filter(t => t.cardIndex === i && t.cycleStart === c.lastCycleStart);
    const txHtml = currentTxs.map(t => `
      <div class="tx-row">
        <div>
          <div class="tx-cat">${t.category}</div>
          <div class="tx-date">${new Date(t.timestamp).toLocaleDateString()}</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="tx-amt">RM ${t.amount.toFixed(2)}</div>
          <button class="tx-del" onclick="deleteTx('${t.id}')">删除</button>
        </div>
      </div>
    `).join('');

    return `
      <div class="card">
        <div class="card-bar ${def.barClass}"></div>
        <div class="card-summary" onclick="toggleDetail(${i})">
          <div>
            <div class="card-name">${def.name}</div>
            <div class="cycle-info">周期: ${start.slice(5)} 至 ${end.slice(5)}</div>
          </div>
          <div>
            <div class="cb-amount">RM ${c.cashback.toFixed(2)}</div>
            <div class="spend-amount">已刷 RM ${c.totalSpend.toFixed(2)}</div>
          </div>
        </div>
        <div class="card-detail" id="detail-${i}">
          ${progressHtml}
          <div style="margin-top:14px; font-weight:800; font-size:14px; color:var(--text-muted);">本周期明细 (${currentTxs.length} 笔)</div>
          ${txHtml || '<div style="padding:10px 0; color:#64748b;">暂无交易</div>'}
        </div>
      </div>
    `;
  }).join('');
}

// 页面初始化渲染
renderAll();
</script>
</body>
</html>
