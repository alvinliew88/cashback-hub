<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Finory</title>

<style>
  :root {
    --bg-base: #000000;
    --glass-surface: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
    --glass-border: rgba(255, 255, 255, 0.25);
    --glass-highlight: rgba(255, 255, 255, 0.4);
    --text: #ffffff;
    --text-secondary: #a0a0a0;
    --text-muted: #666;
    --accent: #7dd3fc;
    --green: #30d158;
    --yellow: #facc15;
    --red: #ef4444;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease: cubic-bezier(0.2, 0.8, 0.4, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg-base); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    font-size: 15px; line-height: 1.4; overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: calc(16px + var(--safe-top)) 16px calc(48px + var(--safe-bottom));
    min-height: 100dvh;
    background: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(239, 68, 68, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(48, 209, 88, 0.15) 0%, transparent 50%),
                #000000;
    background-attachment: fixed;
  }

  .glass-panel {
    background: var(--glass-surface);
    backdrop-filter: blur(24px) saturate(1.5); 
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
    border: 1px solid var(--glass-border);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 var(--glass-highlight);
    border-radius: 24px;
  }

  .install-btn {
    width: 100%; padding: 14px; margin-bottom: 16px;
    background: rgba(30, 64, 175, 0.4); border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 20px; color: #fff; font-size: 15px; font-weight: 700;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
    cursor: pointer; transition: transform 0.2s var(--ease); text-align: center;
  }
  .install-btn:active { transform: scale(0.97); }
  .install-btn.bottom { margin-top: 24px; margin-bottom: 0; }

  .card-grid { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
  .card-wrapper { display: flex; flex-direction: column; }

  .card-tile {
    cursor: pointer; user-select: none;
    transition: transform 0.2s var(--spring), background 0.2s;
    position: relative; overflow: hidden;
  }
  .card-tile:active { transform: scale(0.97); }
  
  .card-tile-bar { height: 6px; width: 100%; position: absolute; top: 0; left: 0; }
  .bar-rhb { background: linear-gradient(90deg, #f97316, #ef4444); }
  .bar-affin { background: linear-gradient(90deg, #3b82f6, #2563eb); }
  .bar-ikhwan { background: linear-gradient(90deg, #9ca3af, #4b5563); }
  .bar-maybank { background: linear-gradient(90deg, #fbbf24, #d97706); }
  
  .tile-content {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 24px 20px 20px; gap: 12px;
  }
  .tile-left { flex: 1; min-width: 0; }
  .tile-right { text-align: right; flex-shrink: 0; padding-left: 8px; }
  
  .tile-name { font-size: 20px; font-weight: 800; color: #fff; line-height: 1.2; letter-spacing: -0.5px; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
  .tile-cycle { font-size: 12px; color: rgba(255,255,255,0.7); font-weight: 500; margin-top: 4px; }
  .tile-number { font-family: 'SF Mono', ui-monospace, monospace; font-size: 15px; font-weight: 600; color: var(--accent); margin-top: 6px; letter-spacing: 2px; }
  
  .tile-cats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; width: 100%; }
  .tile-cat-item {
    font-family: 'SF Mono', ui-monospace, monospace; font-size: 13px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-secondary); padding: 8px 12px; border-radius: 12px; font-weight: 600;
    flex: 1; text-align: center; min-width: 80px;
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
  .tile-cat-item span { color: var(--accent); font-weight: 800; font-size: 15px; }

  .tile-cashback { font-family: 'SF Mono', ui-monospace, monospace; font-size: 28px; font-weight: 900; color: var(--green); line-height: 1; letter-spacing: -0.5px; text-shadow: 0 0 24px rgba(48,209,88,0.4); }
  .tile-spend { font-family: 'SF Mono', ui-monospace, monospace; font-size: 15px; color: #fff; opacity: 0.8; font-weight: 600; margin-top: 8px; }

  .card-outside-meta {
    font-family: 'SF Mono', ui-monospace, monospace; font-size: 12px;
    color: var(--yellow); font-weight: 700; opacity: 0.9;
    text-align: right; margin-top: 8px; padding-right: 12px;
  }

  #appModal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 1000; display: flex; align-items: flex-end; justify-content: center;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity 0.3s var(--ease);
  }
  #appModal.hidden { display: none; opacity: 0; }
  
  .modal-sheet {
    background: linear-gradient(180deg, rgba(40,40,45,0.8) 0%, rgba(20,20,25,0.95) 100%);
    backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-bottom: none;
    border-radius: 36px 36px 0 0; width: 100%;
    max-height: 90vh; overflow-y: auto;
    padding: 12px 20px calc(24px + var(--safe-bottom));
    box-shadow: 0 -10px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.5);
    animation: slideUp 0.4s var(--spring);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle { width: 44px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 3px; margin: 0 auto 20px; }

  .modal-head { text-align: center; margin-bottom: 24px; }
  .modal-title { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
  .modal-hint { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 6px; font-weight: 500; }

  .modal-cats { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
  .cat-pill {
    padding: 14px 24px; min-height: 52px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; border-radius: 24px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.2s var(--spring);
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .cat-pill:active { transform: scale(0.92); }
  .cat-pill.active {
    background: var(--accent); color: #000; border-color: transparent;
    box-shadow: 0 4px 20px rgba(125,211,252,0.5), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .cat-pill.maxed:not(.active) {
    background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.4); color: #fca5a5;
  }
  .cat-pill-badge { font-family: 'SF Mono', ui-monospace, monospace; font-size: 13px; opacity: 0.8; font-weight: 800; }

  .modal-fixed-cat { display: flex; justify-content: center; margin-bottom: 20px; }
  .fixed-cat-badge {
    padding: 12px 24px; background: rgba(125,211,252,0.2);
    border: 1px solid rgba(125,211,252,0.4); box-shadow: inset 0 1px 0 rgba(125,211,252,0.3);
    border-radius: 24px; font-size: 15px; font-weight: 800; color: var(--accent);
  }

  .modal-amount-wrap { margin-bottom: 24px; }
  .modal-amount-label { font-size: 12px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; text-align: center; font-weight: 700; margin-bottom: 8px; }
  .modal-amount-input {
    width: 100%; background: transparent; border: none; color: #fff;
    padding: 0; font-size: 60px; outline: none;
    font-family: 'SF Mono', ui-monospace, monospace; font-weight: 800;
    text-align: center; letter-spacing: -2px; caret-color: var(--accent);
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  .modal-amount-input::placeholder { color: rgba(255,255,255,0.15); }

  .modal-date-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding: 0 8px; }
  .date-label { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
  .date-input {
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; border-radius: 14px; padding: 12px 16px; font-size: 15px;
    font-weight: 600; outline: none; flex: 1; font-family: 'SF Mono', ui-monospace, monospace;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .date-input:focus { border-color: var(--accent); }

  .modal-confirm {
    width: 100%; background: var(--green); border: none; color: #000;
    border-radius: 20px; padding: 20px; font-size: 18px; font-weight: 800;
    cursor: pointer; margin-bottom: 12px; letter-spacing: -0.3px;
    transition: all 0.2s var(--spring);
    box-shadow: 0 8px 24px rgba(48,209,88,0.4), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .modal-confirm:active { transform: scale(0.95); background: #28bc4f; }
  .modal-confirm:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); box-shadow: none; cursor: not-allowed; }

  .modal-back {
    width: 100%; background: transparent; border: none; color: var(--accent);
    padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; border-radius: 16px;
  }
  .modal-back:active { background: rgba(255,255,255,0.1); }

  .modal-history {
    margin-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 16px;
  }
  .modal-history-title {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    text-align: center;
  }
  .modal-tx-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    margin-bottom: 8px;
  }
  .modal-tx-info {
    font-size: 14px;
    color: #fff;
    font-weight: 600;
  }
  .modal-tx-info span {
    color: var(--accent);
    font-family: 'SF Mono', monospace;
    margin-right: 8px;
  }
  .modal-tx-del {
    background: rgba(239,68,68,0.2);
    border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .modal-tx-del:active { background: rgba(239,68,68,0.4); }

  #toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px) scale(0.9);
    background: rgba(48,209,88,0.95); color: #000; padding: 14px 28px; border-radius: 20px;
    font-size: 15px; display: none; z-index: 2000; font-weight: 800;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.5);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    max-width: 90%; text-align: center;
    opacity: 0; transition: all 0.3s var(--spring);
  }
  #toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  #toast.error { background: rgba(239,68,68,0.95); color: #fff; }

  .version-info { text-align: center; color: rgba(255,255,255,0.3); font-size: 11px; margin-top: 24px; font-weight: 500; }
  #jsErr { display: none; background: #b91c1c; color: #fff; padding: 12px; font-size: 12px; margin-bottom: 12px; border-radius: 14px; word-break: break-all; }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>

<script>
window.onerror = function(msg, url, line) {
  var e = document.getElementById('jsErr');
  if (e) { e.style.display = 'block'; e.textContent = 'Error: ' + msg + ' (line ' + line + ')'; }
};

(function() {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function() {});
    });
  }
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault(); deferredPrompt = e;
  });
  window.installApp = function() {
    if (!deferredPrompt) { 
      alert('请点击浏览器右下角菜单(三条横线) → 安装应用 / 添加到主屏幕。\n(如果没看到"安装应用"，请稍等几秒刷新再试)'); 
      return; 
    }
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function() {
      deferredPrompt = null;
    });
  };
})();

var CARDS_DEF = [
  { name: "RHB Shell 2498", shortName: "RHB 2498", barClass: "bar-rhb", resetDay: 13,
    cats: ["Petrol", "Utilities", "Online"],
    caps: { Petrol: 30, Utilities: 10, Online: 10 },
    minSpend: { Petrol: 0, Utilities: 250, Online: 500 },
    rates: { Petrol: [0.01, 0.03, 0.05, 0.12], Utilities: [0.002, 0.01, 0.02, 0.05], Online: [0.002, 0.01, 0.02, 0.05] }
  },
  { name: "RHB Shell 8652", shortName: "RHB 8652", barClass: "bar-rhb", resetDay: 23,
    cats: ["Petrol", "Utilities", "Online"],
    caps: { Petrol: 30, Utilities: 10, Online: 10 },
    minSpend: { Petrol: 0, Utilities: 250, Online: 500 },
    rates: { Petrol: [0.01, 0.03, 0.05, 0.12], Utilities: [0.002, 0.01, 0.02, 0.05], Online: [0.002, 0.01, 0.02, 0.05] }
  },
  { name: "Affin Duo Visa 3322", shortName: "Affin 3322", barClass: "bar-affin", resetDay: 23, cap: 30,
    cats: ["Auto-Billing", "E-Commerce", "E-Wallet"],
    rates: { "Auto-Billing": 0.03, "E-Commerce": 0.03, "E-Wallet": 0.03 },
    autoDebit: { amount: 700, category: "Auto-Billing", note: "Insurance Auto-Debit" }
  },
  { name: "Ikhwan Platinum 6157", shortName: "Ikhwan 6157", barClass: "bar-ikhwan", resetDay: 1, cap: 50, fixedCategory: "Online (8%)", cats: ["Online (8%)"], rates: { "Online (8%)": 0.08 } },
  { name: "Maybank 2 Gold 8943", shortName: "Maybank 8943", barClass: "bar-maybank", resetDay: 1, cap: 50, fixedCategory: "Weekend (5%)", cats: ["Weekend (5%)"], rates: { "Weekend (5%)": 0.05 } }
];

var MAX_CYCLES = 3;
var DATA_VERSION = 35;

function formatDateDMY(d) { var date = new Date(d + 'T00:00:00'); return String(date.getDate()).padStart(2,'0') + '/' + String(date.getMonth()+1).padStart(2,'0') + '/' + date.getFullYear(); }
function formatDateShort(d) { var date = new Date(d + 'T00:00:00'); return String(date.getDate()).padStart(2,'0') + '/' + String(date.getMonth()+1).padStart(2,'0'); }
function getTodayStr() { var n = new Date(); return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0'); }
function getCycleStart(day) { var now = new Date(); var start = new Date(now.getFullYear(), now.getMonth(), day); if (now.getDate() < day) start.setMonth(start.getMonth() - 1); return start.getFullYear() + '-' + String(start.getMonth()+1).padStart(2,'0') + '-' + String(start.getDate()).padStart(2,'0'); }
function getCycleEnd(s) { var p = s.split('-').map(Number); var end = new Date(p[0], p[1]-1, p[2]); end.setMonth(end.getMonth()+1); end.setDate(end.getDate()-1); return end.getFullYear() + '-' + String(end.getMonth()+1).padStart(2,'0') + '-' + String(end.getDate()).padStart(2,'0'); }
function getRateTier(t) { if (t >= 3000) return 3; if (t >= 2000) return 2; if (t >= 1000) return 1; return 0; }

function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isError ? 'error show' : 'show';
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.className = isError ? 'error' : ''; }, 2200);
}

function normalizeCard(raw, i) {
  var def = CARDS_DEF[i]; var c = raw || {};
  return { name: def.name, shortName: def.shortName, barClass: def.barClass, resetDay: def.resetDay, cats: def.cats, caps: def.caps, minSpend: def.minSpend, rates: def.rates, cap: def.cap, fixedCategory: def.fixedCategory, autoDebit: def.autoDebit,
    totalSpend: typeof c.totalSpend === 'number' ? c.totalSpend : 0, cashback: typeof c.cashback === 'number' ? c.cashback : 0,
    categoryCashback: c.categoryCashback || {}, categorySpend: c.categorySpend || {},
    lastCycleStart: c.lastCycleStart || getCycleStart(def.resetDay), autoDebitCycle: c.autoDebitCycle || null };
}

function getDefaultState() { var cards = []; for (var i = 0; i < CARDS_DEF.length; i++) cards.push(normalizeCard({}, i)); return { version: DATA_VERSION, cards: cards, transactions: [] }; }

function loadState() {
  var raw = localStorage.getItem('finoryData'); var state = null;
  if (raw) { try { state = JSON.parse(raw); } catch(e) { state = null; } }
  if (!state || !Array.isArray(state.cards)) { state = getDefaultState(); saveState(state); return state; }
  var nc = []; for (var i = 0; i < CARDS_DEF.length; i++) nc.push(normalizeCard(state.cards[i], i));
  state.cards = nc; if (!Array.isArray(state.transactions)) state.transactions = [];
  state.version = DATA_VERSION; saveState(state); return state;
}
function saveState(state) { try { localStorage.setItem('finoryData', JSON.stringify(state)); } catch(e) { showToast('保存失败', true); } }

function checkAndReset(state) {
  state.cards.forEach(function(c) {
    var s = getCycleStart(c.resetDay);
    if (c.lastCycleStart !== s) { c.totalSpend = 0; c.cashback = 0; c.categoryCashback = {}; c.categorySpend = {}; c.lastCycleStart = s; }
  });
}

function applyAutoDebits(state) {
  var changed = false;
  state.cards.forEach(function(c, i) {
    var def = CARDS_DEF[i];
    if (def.autoDebit && c.lastCycleStart !== c.autoDebitCycle) {
      var rate = def.rates[def.autoDebit.category];
      var earned = Math.max(0, Math.min(def.autoDebit.amount * rate, (def.cap || 999) - c.cashback));
      c.totalSpend += def.autoDebit.amount; c.cashback += earned;
      c.categorySpend[def.autoDebit.category] = (c.categorySpend[def.autoDebit.category] || 0) + def.autoDebit.amount;
      c.autoDebitCycle = c.lastCycleStart;
      state.transactions.push({ id: Date.now() + '-auto-' + i, cardIndex: i, cardName: def.name, amount: def.autoDebit.amount, category: def.autoDebit.category, note: def.autoDebit.note, date: getTodayStr(), timestamp: Date.now(), cycleStart: c.lastCycleStart });
      changed = true;
    }
  });
  if (changed) saveState(state);
}

function getRateForCategory(def, cat, tier) {
  if (def.name.indexOf('RHB') !== -1) { var a = def.rates[cat]; return a && a.length > tier ? a[tier] : 0; }
  return def.rates && def.rates[cat] ? def.rates[cat] : 0;
}
function computeCategoryTarget(def, cs, cat) {
  if (def.name.indexOf('RHB') === -1) return null;
  var tier = getRateTier(cs.totalSpend); var rate = getRateForCategory(def, cat, tier);
  if (rate === 0) return Infinity;
  var cap = def.caps && def.caps[cat] ? def.caps[cat] : 0;
  var min = def.minSpend && def.minSpend[cat] ? def.minSpend[cat] : 0;
  var t = cap / rate; if (t < min) t = min; return t;
}
function getRate(def, cs, cat, amount) {
  if (def.name.indexOf('RHB') !== -1) {
    var min = def.minSpend && def.minSpend[cat] ? def.minSpend[cat] : 0;
    if ((cs.categorySpend[cat] || 0) + amount < min) return 0;
    var tier = getRateTier(cs.totalSpend + amount); var a = def.rates[cat];
    return a && a.length > tier ? a[tier] : 0;
  }
  return def.rates && def.rates[cat] ? def.rates[cat] : 0;
}
function isCatMaxed(cs, def, cat) {
  if (def.name.indexOf('RHB') !== -1) { var cap = def.caps && def.caps[cat] ? def.caps[cat] : 999; return (cs.categoryCashback[cat] || 0) >= cap; }
  return cs.cashback >= (def.cap || 999);
}

function addTransaction(cardIndex, amount, cat, note, txDate) {
  var state = loadState(); checkAndReset(state);
  var cs = state.cards[cardIndex]; var def = CARDS_DEF[cardIndex];
  var rate = getRate(def, cs, cat, amount); var earned = 0;
  if (def.name.indexOf('RHB') !== -1) { var cap = def.caps && def.caps[cat] ? def.caps[cat] : 999; var cur = cs.categoryCashback[cat] || 0; earned = Math.min(amount * rate, cap - cur); if (earned < 0) earned = 0; cs.cashback += earned; cs.categoryCashback[cat] = cur + earned; }
  else { var cap2 = def.cap || 999; var cur2 = cs.cashback; earned = Math.min(amount * rate, cap2 - cur2); if (earned < 0) earned = 0; cs.cashback += earned; }
  cs.totalSpend += amount; cs.categorySpend[cat] = (cs.categorySpend[cat] || 0) + amount;
  state.transactions.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2,7), cardIndex: cardIndex, cardName: def.name, amount: amount, category: cat, note: note || '', date: txDate || getTodayStr(), timestamp: Date.now(), cycleStart: cs.lastCycleStart });
  cleanupOldCycles(state); saveState(state); renderHome();
  renderModal();
  showToast('已记录 RM ' + amount.toFixed(2) + ' · ' + cat);
}
function deleteTransaction(txId) {
  if (!confirm('Delete this transaction?')) return;
  var state = loadState(); var tx = null;
  for (var i = 0; i < state.transactions.length; i++) if (state.transactions[i].id === txId) { tx = state.transactions[i]; break; }
  if (!tx) return;
  state.transactions = state.transactions.filter(function(t) { return t.id !== txId; });
  recalcCard(state, tx.cardIndex); cleanupOldCycles(state); saveState(state); renderHome();
  renderModal();
}
function recalcCard(state, ci) {
  var def = CARDS_DEF[ci]; var cs = state.cards[ci];
  cs.totalSpend = 0; cs.cashback = 0; cs.categoryCashback = {}; cs.categorySpend = {};
  var txs = state.transactions.filter(function(t) { return t.cardIndex === ci && t.cycleStart === cs.lastCycleStart; }).sort(function(a, b) { return a.timestamp - b.timestamp; });
  txs.forEach(function(tx) {
    var rate = getRate(def, cs, tx.category, tx.amount); var earned = 0;
    if (def.name.indexOf('RHB') !== -1) { var cap = def.caps && def.caps[tx.category] ? def.caps[tx.category] : 999; var cur = cs.categoryCashback[tx.category] || 0; earned = Math.min(tx.amount * rate, cap - cur); if (earned < 0) earned = 0; cs.cashback += earned; cs.categoryCashback[tx.category] = cur + earned; }
    else { var cap2 = def.cap || 999; var cur2 = cs.cashback; earned = Math.min(tx.amount * rate, cap2 - cur2); if (earned < 0) earned = 0; cs.cashback += earned; }
    cs.totalSpend += tx.amount; cs.categorySpend[tx.category] = (cs.categorySpend[tx.category] || 0) + tx.amount;
  });
}
function cleanupOldCycles(state) {
  state.cards.forEach(function(c, i) {
    var cycles = [];
    state.transactions.forEach(function(tx) { if (tx.cardIndex === i && cycles.indexOf(tx.cycleStart) === -1) cycles.push(tx.cycleStart); });
    cycles.sort(function(a, b) { return b.localeCompare(a); });
    if (cycles.length > MAX_CYCLES) {
      var del = cycles.slice(MAX_CYCLES);
      state.transactions = state.transactions.filter(function(tx) { if (tx.cardIndex !== i) return true; return del.indexOf(tx.cycleStart) === -1; });
    }
  });
}
function getLastRecordDate(state, i) {
  var c = state.cards[i];
  var txs = state.transactions.filter(function(t) { return t.cardIndex === i && t.cycleStart === c.lastCycleStart; });
  if (txs.length === 0) return '';
  var m = txs[0].date; txs.forEach(function(t) { if (t.date > m) m = t.date; }); return m;
}

function renderHome() {
  var state = loadState(); checkAndReset(state); applyAutoDebits(state); saveState(state);
  var grid = document.getElementById('card-grid'); if (!grid) return;
  try {
    grid.innerHTML = state.cards.map(function(c, i) {
      var def = CARDS_DEF[i];
      var last = getLastRecordDate(state, i);
      var lastText = last ? ('上次 ' + formatDateDMY(last)) : '尚未记录';
      
      var cycleStart = c.lastCycleStart;
      var cycleEnd = getCycleEnd(cycleStart);
      var cycleText = '周期 ' + formatDateShort(cycleStart) + ' — ' + formatDateShort(cycleEnd);
      
      var catsHtml = '';
      var displayCats = def.fixedCategory ? [def.fixedCategory] : def.cats;
      displayCats.forEach(function(cat) {
        var spent = c.categorySpend[cat] || 0;
        catsHtml += '<div class="tile-cat-item">' + cat + ' <span>' + spent.toFixed(0) + '</span></div>';
      });

      return '<div class="card-wrapper">' +
        '<div class="card-tile glass-panel" onclick="window.openModal(' + i + ')">' +
          '<div class="card-tile-bar ' + def.barClass + '"></div>' +
          '<div class="tile-content">' +
            '<div class="tile-left">' +
              '<div class="tile-name">' + def.shortName + '</div>' +
              '<div class="tile-cycle">' + cycleText + '</div>' +
              '<div class="tile-number">•••• ' + def.shortName.slice(-4) + '</div>' +
              '<div class="tile-cats">' + catsHtml + '</div>' +
            '</div>' +
            '<div class="tile-right">' +
              '<div class="tile-cashback">RM ' + (c.cashback || 0).toFixed(2) + '</div>' +
              '<div class="tile-spend">Spend ' + (c.totalSpend || 0).toFixed(2) + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="card-outside-meta">' + lastText + '</div>' +
      '</div>';
    }).join('');
  } catch(e) {
    grid.innerHTML = '<div style="color:#ef4444;padding:20px;background:#1a1a1a;border-radius:14px;">渲染出错：' + e.message + '</div>';
  }
}

var appModal = { cardIndex: null, category: null };

function openModal(i) {
  appModal.cardIndex = i;
  var def = CARDS_DEF[i];
  if (def.fixedCategory) {
    appModal.category = def.fixedCategory;
  } else if (def.name.indexOf('RHB') !== -1) {
    appModal.category = "Online";
  } else {
    appModal.category = def.cats[0];
  }
  
  document.getElementById('appModal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  renderModal();
  
  setTimeout(function() {
    var inp = document.getElementById('amt-input');
    if (inp) inp.focus();
  }, 320);
}

function closeModal() {
  document.getElementById('appModal').classList.add('hidden');
  document.body.style.overflow = '';
  appModal.cardIndex = null; appModal.category = null;
}

function getCatDisplay(cs, def, cat) {
  var target = computeCategoryTarget(def, cs, cat);
  var spent = cs.categorySpend[cat] || 0;
  if (target === null) return { spent: cs.cashback || 0, targetStr: String(def.cap || 0), minNote: '' };
  if (target === Infinity) return { spent: spent, targetStr: '—', minNote: '' };
  var min = def.minSpend && def.minSpend[cat] ? def.minSpend[cat] : 0;
  var minNote = min > 0 && spent < min ? ' · 需达 ' + min : '';
  return { spent: spent, targetStr: target.toFixed(0), minNote: minNote };
}

function renderModal() {
  var i = appModal.cardIndex; if (i === null) return;
  var def = CARDS_DEF[i];
  var state = loadState();
  var c = state.cards[i];
  var cat = appModal.category;

  document.getElementById('modal-title').textContent = def.shortName;
  var last = getLastRecordDate(state, i);
  document.getElementById('modal-hint').textContent = last ? ('上次记录 ' + formatDateDMY(last)) : '本周期尚未记录';

  var body = document.getElementById('modal-body');
  var html = '';

  if (def.fixedCategory) {
    html += '<div class="modal-fixed-cat"><div class="fixed-cat-badge">' + def.fixedCategory + '</div></div>';
  } else {
    html += '<div class="modal-cats">';
    def.cats.forEach(function(ct) {
      var active = (cat === ct) ? 'active' : '';
      var maxed = isCatMaxed(c, def, ct) ? 'maxed' : '';
      var disp = getCatDisplay(c, def, ct);
      html += '<button class="cat-pill ' + active + ' ' + maxed + '" onclick="window.selectCat(\'' + ct + '\')">' +
        '<span>' + ct + '</span>' +
        '<span class="cat-pill-badge">' + disp.spent.toFixed(0) + '</span>' +
      '</button>';
    });
    html += '</div>';
  }

  var defaultDate = getTodayStr();
  
  html += '<div class="modal-date-row"><span class="date-label">日期</span><input type="date" id="amt-date" class="date-input" value="' + defaultDate + '"></div>';
  html += '<div class="modal-amount-wrap">' +
    '<div class="modal-amount-label">金额</div>' +
    '<input type="number" id="amt-input" class="modal-amount-input" placeholder="0.00" step="0.01" inputmode="decimal">' +
  '</div>';
  html += '<button class="modal-confirm" id="amt-confirm" onclick="window.confirmAmount()" ' + (cat ? '' : 'disabled') + '>' + (cat ? '记录' : '请先选分类') + '</button>';

  var currentTxs = state.transactions.filter(function(t) { 
    return t.cardIndex === i && t.cycleStart === c.lastCycleStart; 
  }).sort(function(a, b) { return b.timestamp - a.timestamp; });

  if (currentTxs.length > 0) {
    html += '<div class="modal-history">';
    html += '<div class="modal-history-title">本周期记录 (' + currentTxs.length + ')</div>';
    currentTxs.forEach(function(tx) {
      html += '<div class="modal-tx-row">' +
        '<div class="modal-tx-info"><span>' + formatDateShort(tx.date) + '</span>' + tx.category + ' - RM ' + tx.amount.toFixed(2) + '</div>' +
        '<button class="modal-tx-del" onclick="window.deleteTransaction(\'' + tx.id + '\')">删除</button>' +
      '</div>';
    });
    html += '</div>';
  }

  html += '<button class="modal-back" style="margin-top:20px;" onclick="window.closeModal()">完成</button>';

  body.innerHTML = html;

  var inp = document.getElementById('amt-input');
  if (inp) {
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); confirmAmount(); }
    });
    inp.addEventListener('input', function() {
      var btn = document.getElementById('amt-confirm');
      var amt = parseFloat(inp.value);
      if (appModal.category && amt > 0) { btn.disabled = false; btn.textContent = '记录'; }
      else { btn.disabled = true; btn.textContent = appModal.category ? '输入金额' : '请先选分类'; }
    });
  }
}

function selectCat(ct) {
  appModal.category = ct;
  renderModal();
  setTimeout(function() {
    var inp = document.getElementById('amt-input');
    if (inp) inp.focus();
  }, 80);
}

function confirmAmount() {
  var inp = document.getElementById('amt-input');
  var dateIn = document.getElementById('amt-date');
  if (!inp) return;
  var amt = parseFloat(inp.value);
  if (!appModal.category) { showToast('请先选分类', true); return; }
  if (!amt || amt <= 0) { showToast('请输入金额', true); inp.focus(); return; }
  var txDate = dateIn ? dateIn.value : getTodayStr();
  
  addTransaction(appModal.cardIndex, amt, appModal.category, '', txDate);
  
  inp.value = '';
  var btn = document.getElementById('amt-confirm');
  if (btn) { btn.disabled = true; btn.textContent = '输入金额'; }
  inp.focus();
}

document.getElementById('appModal').addEventListener('click', function(e) {
  if (e.target.id === 'appModal') closeModal();
});

window.openModal = openModal;
window.closeModal = closeModal;
window.selectCat = selectCat;
window.confirmAmount = confirmAmount;
window.deleteTransaction = deleteTransaction;

renderHome();
</script>
</body>
</html>
